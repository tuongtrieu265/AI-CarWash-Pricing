version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carwash-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: carwash_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: carwash-backend
    ports:
      - "9090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: carwash-frontend
    ports:
      - "3003:3000"
    environment:
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
